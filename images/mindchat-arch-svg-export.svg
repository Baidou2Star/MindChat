<svg width="820" height="800" viewBox="0 0 820 800" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect width="820" height="800" fill="#ffffff"/>

<!-- ── Row1: Qt Client  cx=410 ── -->
<rect x="260" y="24" width="300" height="52" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="410" y="45" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Qt 客户端</text>
<text x="410" y="63" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">聊天 TCP 通道 ｜ 资源 TCP 通道</text>

<!-- Client → GateServer (left branch) -->
<path d="M350 76 L350 106 L190 106 L190 134" fill="none" stroke="#7F77DD" stroke-width="1.3" marker-end="url(#arr)"/>
<text x="262" y="102" text-anchor="middle" font-size="12" fill="#7F77DD">HTTP</text>

<!-- Client → ResourceServer (right branch) -->
<path d="M470 76 L470 106 L600 106 L600 134" fill="none" stroke="#7F77DD" stroke-width="1.3" marker-end="url(#arr)"/>
<text x="542" y="102" text-anchor="middle" font-size="12" fill="#7F77DD">TCP</text>

<!-- ── Row2L: GateServerWin  x=70 w=240 cx=190 ── -->
<rect x="70" y="134" width="240" height="52" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="190" y="155" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">GateServerWin</text>
<text x="190" y="173" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">HTTP 网关 ｜ 登录 / 注册</text>

<!-- ── Row2R: ResourceServer  x=480 w=240 cx=600 ── -->
<rect x="480" y="134" width="240" height="52" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="600" y="155" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">ResourceServer</text>
<text x="600" y="173" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">文件 / 图片 ｜ 断点续传</text>

<!-- GateServer → StatusServer -->
<path d="M190 186 L190 216 L330 216 L330 244" fill="none" stroke="#0F6E56" stroke-width="1.3" marker-end="url(#arr)"/>
<text x="254" y="212" text-anchor="middle" font-size="12" fill="#0F6E56">gRPC</text>

<!-- GateServer → VarifyServer: mid-right channel x=440 -->
<path d="M310 160 L440 160 L440 530 L480 530" fill="none" stroke="#3B6D11" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arr)"/>
<text x="444" y="150" text-anchor="start" font-size="12" fill="#3B6D11">gRPC</text>

<!-- ResourceServer → ChatServer2: far right channel x=760 -->
<path d="M720 160 L760 160 L760 384 L720 384" fill="none" stroke="#993C1D" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr)"/>
<text x="764" y="275" text-anchor="start" font-size="12" fill="#993C1D">gRPC 通知</text>

<!-- ── Row3: StatusServer  x=260 w=300 cx=410 ── -->
<rect x="260" y="244" width="300" height="52" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="410" y="265" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">StatusServer</text>
<text x="410" y="283" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">负载均衡 ｜ Token 下发</text>

<!-- StatusServer → ChatServer1 -->
<path d="M330 296 L330 326 L190 326 L190 354" fill="none" stroke="#185FA5" stroke-width="1.3" marker-end="url(#arr)"/>
<text x="254" y="322" text-anchor="middle" font-size="12" fill="#185FA5">gRPC</text>

<!-- StatusServer → ChatServer2 -->
<path d="M490 296 L490 326 L600 326 L600 354" fill="none" stroke="#185FA5" stroke-width="1.3" marker-end="url(#arr)"/>
<text x="550" y="322" text-anchor="middle" font-size="12" fill="#185FA5">gRPC</text>

<!-- ── ChatServer cluster frame  x=58 w=664 ── -->
<rect x="58" y="336" width="664" height="88" rx="12" fill="none" stroke="#378ADD" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="390" y="434" text-anchor="middle" font-size="12" fill="#378ADD">聊天服务集群</text>

<!-- ── Row4L: ChatServer1  x=70 w=240 cx=190 ── -->
<rect x="70" y="354" width="240" height="52" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="190" y="375" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">ChatServer 节点 1</text>
<text x="190" y="393" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">长连接 ｜ 消息路由</text>

<!-- ── Row4R: ChatServer2  x=480 w=240 cx=600 ── -->
<rect x="480" y="354" width="240" height="52" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="600" y="375" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">ChatServer 节点 2</text>
<text x="600" y="393" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">长连接 ｜ 消息路由</text>

<!-- Chat1 ↔ Chat2 跨节点 -->
<line x1="310" y1="380" x2="480" y2="380" fill="none" stroke="#888780" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr)"/>
<text x="395" y="372" text-anchor="middle" font-size="12" fill="#5F5E5A">跨节点转发</text>

<!-- Chat1 → LLMServer -->
<line x1="190" y1="424" x2="190" y2="504" fill="none" stroke="#185FA5" stroke-width="1.3" marker-end="url(#arr)"/>
<text x="164" y="465" text-anchor="middle" font-size="12" fill="#185FA5">gRPC</text>

<!-- ── Row5L: LLMServer  x=70 w=240 cx=190 ── -->
<rect x="70" y="504" width="240" height="52" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="190" y="525" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">LLMServer</text>
<text x="190" y="543" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">/chat ｜ /extract_todo</text>

<!-- ── Row5R: VarifyServer  x=480 w=240 cx=600 ── -->
<rect x="480" y="504" width="240" height="52" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="600" y="525" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#27500A">VarifyServer</text>
<text x="600" y="543" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3B6D11">Node.js ｜ 验证码服务</text>

<!-- LLMServer → MySQL -->
<line x1="190" y1="556" x2="190" y2="664" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arr)"/>

<!-- VarifyServer → Redis -->
<line x1="600" y1="556" x2="600" y2="664" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arr)"/>

<!-- Chat1 → MySQL: left channel x=30 -->
<path d="M100 424 L30 424 L30 690 L70 690" fill="none" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>

<!-- Chat2 → Redis: inner right channel x=750 (inside frame, left of gRPC notice) -->
<path d="M660 424 L750 424 L750 690 L720 690" fill="none" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>

<!-- ── Row6L: MySQL  x=70 w=240 cx=190 ── -->
<rect x="70" y="664" width="240" height="52" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="190" y="685" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">MySQL</text>
<text x="190" y="703" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">持久化存储</text>

<!-- ── Row6R: Redis  x=480 w=240 cx=600 ── -->
<rect x="480" y="664" width="240" height="52" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="600" y="685" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">Redis</text>
<text x="600" y="703" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">缓存 ｜ 状态 ｜ 分布式锁</text>

</svg>
